# CI scenario: a read-only root filesystem, non-root and without capabilities,
# with a writable /tmp from extraVolumes. Proves the pod starts and serves so.
replicaCount: 1

image:
  repository: titiler-openeo
  tag: dev

# Small, as in postgres-values.yaml: `ct install --skip-clean-up` keeps the
# earlier scenarios running on the same kind node.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

extraVolumes:
  - name: tmp
    emptyDir:
      sizeLimit: 1Gi
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
