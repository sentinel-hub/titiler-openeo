# Microsoft Planetary Computer flavor.
#
# Asset signing needs no configuration: it switches on because stac.apiUrl
# points at Planetary Computer, and the SAS tokens it mints are anonymous.
# See docs/adr/0005-asset-href-signing.md and docs/src/planetary-computer.md.
replicaCount: 1

image:
  repository: titiler-openeo
  tag: dev

stac:
  apiUrl: "https://planetarycomputer.microsoft.com/api/stac/v1"

env:
  # Turns SAS signing on for this deployment's blob assets. Required since
  # 0.18.0, where signing stopped being inferred from the STAC API hostname
  # (issue #377, docs/adr/0005-asset-href-signing.md S2.3).
  TITILER_OPENEO_ASSET_SIGNER: "planetary-computer"
  # `noaa-c-cap` advertises a provider url with no colon after the scheme,
  # which fails openEO response validation and takes the whole GET /collections
  # response with it. Verified upstream 2026-08-10.
  TITILER_OPENEO_EXCLUDE_COLLECTIONS: "noaa-c-cap"
  # Planetary Computer's Sentinel-2 L2A has no scale/offset in STAC and 1/0 in
  # the COG header (microsoft/PlanetaryComputer#134). The BOA quantification
  # and offset come from each product's MTD_MSIL2A.xml.
  TITILER_OPENEO_PROCESSING_SCALE_OFFSET_COLLECTIONS: '{"sentinel-2-l2a": ["sentinel2-boa"]}'
  CPL_TMPDIR: /tmp
  GDAL_CACHEMAX: "200"
  VSI_CACHE: "TRUE"
  VSI_CACHE_SIZE: "5000000"
  CPL_VSIL_CURL_CACHE_SIZE: "67108864"
  # Required, not merely a tuning knob: signed hrefs carry a query string, and
  # a directory listing on every open would be both wrong and expensive.
  GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
  GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
  GDAL_HTTP_MULTIPLEX: "YES"
  GDAL_HTTP_VERSION: 2
  PYTHONWARNINGS: "ignore"

# Default services shown to every user, from the chart's `files/` directory.
database:
  defaultServices: "files/planetarycomputer.json"

# Microsoft Entra ID, multi-tenant: the `common` well-known URL accepts work,
# school and personal Microsoft accounts. The token's `iss` must equal the
# discovery issuer template with the token's own `tid` in it; `allowedTenants`
# limits which tenants can sign in (docs/adr/0006-microsoft-entra-oidc.md S2.3).
auth:
  method: "basic"
  basic:
    enabled: true
    users:
      - username: "test"
        password: "password"
  oidc:
    enabled: false
    clientId: ""
    wellKnownUrl: "https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration"
    redirectUrl: ""  # Space-separated, e.g. "https://editor.openeo.org/ http://localhost:8080/"
    scopes: "openid email profile"  # Add "api://<client_id>/openeo" for an API-audienced token
    audiences: ""  # "api://<client_id>"
    nameClaim: "preferred_username"
    userIdClaim: ""  # Empty = "sub", which stays unique across tenants; `oid` does not
    allowedTenants: ""  # Empty = all tenants and personal accounts
    title: "Microsoft Entra ID"
    description: "Sign in with your Microsoft work, school or personal account"

# Optional: raises Planetary Computer SAS API rate limits. Supply it from a
# Secret rather than inline.
envVars:
  fromSecret: []
  # - name: TITILER_OPENEO_PC_SUBSCRIPTION_KEY
  #   secretName: planetary-computer
  #   secretKey: subscription-key
  fromConfigMap: []
