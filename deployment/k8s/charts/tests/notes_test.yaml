suite: test install notes
templates:
  - NOTES.txt
tests:
  - it: should count the users configured in values
    set:
      auth.basic.users:
        - username: alice
          password: alice-test-pass
    asserts:
      - matchRegexRaw:
          pattern: "Current number of configured users: 1"

  - it: should name the variable when the users are supplied through env or envVars
    set:
      auth.basic.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "Users are read from TITILER_OPENEO_AUTH_USERS"
      - notMatchRegexRaw:
          pattern: "Current number of configured users"

  # Name and instance alone also match the bundled PostgreSQL and schema Job pods.
  - it: should port-forward to an API pod
    asserts:
      - matchRegexRaw:
          pattern: '-l "app\.kubernetes\.io/name=titiler-openeo,app\.kubernetes\.io/instance=RELEASE-NAME,app\.kubernetes\.io/component=api"'
