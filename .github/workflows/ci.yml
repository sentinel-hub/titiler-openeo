name: CI

# On every pull request, but only on push to main
on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  workflow_dispatch:
  # Nightly, so the image is rebuilt (CI builds have no layer cache) and
  # re-scanned with that day's Trivy database: catches Wolfi package drift and
  # new CVEs between merges. Nothing is pushed on schedule.
  schedule:
    - cron: '0 4 * * *'

env:
  LATEST_PY_VERSION: '3.12'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    # Runs the multi-replica race tests (tests/test_sqlalchemy_races.py).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.*" 
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: |
          uv sync --extra postgres

      - name: Test titiler.openeo
        env:
          TITILER_OPENEO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          uv run pytest --cov=titiler.openeo --cov-report=xml --cov-append --cov-report=term-missing

      - name: run pre-commit
        if: ${{ matrix.python-version == env.LATEST_PY_VERSION }}
        run: |
          uv run pre-commit run --all-files

      - name: Upload Results
        if: ${{ matrix.python-version == env.LATEST_PY_VERSION }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}


  publish-docker:
    needs: [tests]
    runs-on: ubuntu-latest
    # only publish on main, tags, and PRs
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Determine whether this run can push
        # GITHUB_TOKEN is read-only for pull_request runs triggered by a fork,
        # regardless of the `permissions:` requested above -- pushing would
        # fail there no matter what, so skip it instead of failing CI on
        # every external contribution.
        id: can-push
        run: |
          echo "value=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event.pull_request.head.repo.full_name == github.repository }}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to github container registry
        if: steps.can-push.outputs.value == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}

      - name: build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Gates the push: an image that breaks its runtime contract never reaches
      # ghcr.io. Via env: so nothing is interpolated into run:.
      - name: smoke-test the image
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageid }}
        run: ./docker/smoke-test.sh "$IMAGE_REF"

      - name: fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      # Same inputs as the build step, so this comes from its cache.
      - name: push
        if: steps.can-push.outputs.value == 'true' && github.event_name != 'schedule'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# PyPI publishing lives in release-please.yml. It ran here on tag pushes, but
# release-please creates tags with GITHUB_TOKEN, which does not start
# workflows, so this job never ran. Use the `publish_tag` input of the
# Release Please workflow to publish a tag by hand.
