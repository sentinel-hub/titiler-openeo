name: Nightly image scan

# Rebuilds the image from scratch and re-scans it with that day's Trivy
# database, to catch Wolfi package drift and new CVEs between merges. Nothing is
# pushed. Also runs on pull requests that change this file.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly-image.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: titiler-openeo:nightly

      - name: smoke-test the image
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageid }}
        run: ./docker/smoke-test.sh "$IMAGE_REF"

      - name: fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          cache-dir: ${{ runner.temp }}/trivy
