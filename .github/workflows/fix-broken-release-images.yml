name: Fix Broken Release Images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        type: boolean
        default: true
      tag:
        description: 'Force-rebuild and replace these version tags (comma-separated, e.g. v0.1.0,v0.16.5), skipping the broken-tag scan'
        type: string
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore or rebuild broken release images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: sentinel-hub
          REPOSITORY_NAME: titiler-openeo
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/fix_broken_release_images.py
