name: Release Please

on:
  push:
    branches:
      - main
  # Break-glass: build an existing tag and publish it to PyPI when the
  # automatic run failed. PyPI trusted publishing is bound to this workflow
  # file name and to the pypi-release environment, so the manual path must
  # stay in this file to use the same credentials.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to build and publish to PyPI (for example v0.17.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        id: release
        with:
          config-file: "release-please-config.json"
          manifest-file: ".release-please-manifest.json"

  build_package:
    needs: release-please
    runs-on: ubuntu-latest
    # On push: run only when release-please cut a release for the root
    # package. On workflow_dispatch: always run, for the tag given as input.
    # release-please is skipped on workflow_dispatch, and a skipped dependency
    # skips this job whatever the condition says, so the condition needs
    # !cancelled() to stay reachable.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch'
        || (needs.release-please.result == 'success'
            && needs.release-please.outputs.paths_released
            && contains(fromJSON(needs.release-please.outputs.paths_released), '.'))
      ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Empty on push, which checks out the default ref.
          ref: ${{ inputs.publish_tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.*"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      # Guards against publishing a tag whose code carries a different
      # version. Runs through `uv run` so it uses the project environment.
      - name: Check that the tag matches the package version
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          expected="${PUBLISH_TAG#v}"
          actual="$(uv run python -c 'import titiler.openeo; print(titiler.openeo.__version__)')"
          echo "tag=${expected} module=${actual}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Tag ${PUBLISH_TAG} holds version ${actual}"
            exit 1
          fi

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ./dist/

  upload_pypi:
    name: Upload release to PyPI
    needs: [build_package]
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/titiler-openeo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifact
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-docker:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.paths_released && contains(fromJSON(needs.release-please.outputs.paths_released), '.') }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse semver from tag
        id: semver
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.semver.outputs.version }}
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=${{ steps.semver.outputs.minor }}
            type=raw,value=${{ steps.semver.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-helm-chart:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.paths_released && contains(fromJSON(needs.release-please.outputs.paths_released), 'deployment/k8s/charts') }}
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.2

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: deployment/k8s
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  publish-helm-chart-oci:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.paths_released && contains(fromJSON(needs.release-please.outputs.paths_released), 'deployment/k8s/charts') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.2

      # Pushing to ghcr.io/developmentseed/charts (a different org than the one
      # hosting this repo) requires a PAT with `write:packages` on the
      # developmentseed org — the default GITHUB_TOKEN only grants package
      # scope on the current repo's org.
      - name: Log in to GHCR (developmentseed)
        run: |
          echo "${{ secrets.GHCR_DEVSEED_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package deployment/k8s/charts -d dist/

      - name: Push chart to OCI registry
        run: |
          for pkg in dist/titiler-openeo-*.tgz; do
            echo "Pushing $pkg ..."
            helm push "$pkg" oci://ghcr.io/developmentseed/charts
          done